
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
